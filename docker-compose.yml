# EPO — Escritório de Processos
#
# Produção (Coolify ou servidor próprio):
#   docker compose up -d --build
#
# Local (publica a porta 3000 no host):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Administração do banco: a aplicação expõe /admin/db (exige login). O sqlite-web não é publicado.
name: epo

services:
  app:
    build: .
    image: epo:latest
    restart: unless-stopped
    # Sem porta publicada no host: o proxy (Coolify/Traefik) encaminha para a porta 3000 interna.
    expose:
      - "3000"
    environment:
      DATA_DIR: /app/data
    volumes:
      # Banco SQLite (epo.sqlite, com WAL) e SVGs enviados. Sobrevive a rebuilds e atualizações.
      - epo-data:/app/data
    stop_grace_period: 20s

  sqlite-web:
    image: coleifer/sqlite-web:latest
    restart: unless-stopped
    entrypoint: ["sqlite_web"]
    # Mesmo UID da aplicação: evita arquivos -wal/-shm que a app não consegue escrever.
    user: "1001:1001"
    # Somente leitura e atrás do prefixo /admin/db. Não tem login próprio: o acesso
    # é feito pela rota /admin/db da própria aplicação, que exige sessão.
    command: ["-H", "0.0.0.0", "-p", "8080", "-x", "-r", "-u", "/admin/db", "-f", "/data/epo.sqlite"]
    volumes:
      - epo-data:/data
    # Sem "ports": o serviço não é publicado. Só a aplicação acessa, pela rede interna do Compose.
    expose:
      - "8080"

volumes:
  epo-data:
